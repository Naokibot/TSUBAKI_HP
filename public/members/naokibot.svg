<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="title desc">
  <title id="title">Naokibot profile icon</title>
  <desc id="desc">A dark circular profile icon with a glowing firefly and the letter N.</desc>
  <defs>
    <radialGradient id="bg" cx="68%" cy="26%" r="84%">
      <stop offset="0" stop-color="#27335f"/>
      <stop offset="0.55" stop-color="#151a30"/>
      <stop offset="1" stop-color="#090b14"/>
    </radialGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#fff8b5" stop-opacity=".95"/>
      <stop offset=".36" stop-color="#ffe463" stop-opacity=".72"/>
      <stop offset="1" stop-color="#ffd43b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#d5e7ff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#84a4ff" stop-opacity=".25"/>
    </linearGradient>
  </defs>
  <rect width="640" height="640" rx="160" fill="url(#bg)"/>
  <circle cx="468" cy="160" r="124" fill="url(#glow)"/>
  <g transform="translate(463 166) rotate(-24)">
    <ellipse cx="-32" cy="-8" rx="56" ry="24" fill="url(#wing)" transform="rotate(-27)"/>
    <ellipse cx="32" cy="-8" rx="56" ry="24" fill="url(#wing)" transform="rotate(27)"/>
    <ellipse cy="7" rx="18" ry="42" fill="#1d2337"/>
    <ellipse cy="33" rx="14" ry="22" fill="#ffe36a"/>
    <circle cy="-31" r="17" fill="#111625"/>
  </g>
  <text x="78" y="494" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="280" font-weight="850" fill="#f7f8ff">N</text>
</svg>
